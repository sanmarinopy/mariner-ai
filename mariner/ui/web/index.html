<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mariner</title>
<style>
  :root { --c: #39d0ff; --dim: #1b5f75; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--c); overflow: hidden;
    font-family: "Segoe UI", "DejaVu Sans", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  body.holo { cursor: none; }
  body.holo #console { display: none; }
  #console { position: fixed; left: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px));
    font-size: 13px; z-index: 2; }
  #log { max-height: 38vh; overflow-y: auto; margin-bottom: 8px; padding-right: 4px; }
  #log div { margin: 4px 0; line-height: 1.35; opacity: .9; }
  #log .you { color: #9fe8b8; } #log .callout { color: #ffb000; } #log .sys { color: var(--dim); }
  #form { display: flex; gap: 6px; }
  #q { flex: 1; background: #000; color: var(--c); border: 1px solid var(--dim); border-radius: 6px;
    padding: 8px 10px; font: inherit; outline: none; }
  #q:focus { border-color: var(--c); }
  #form button { background: #000; color: var(--c); border: 1px solid var(--dim); border-radius: 6px;
    padding: 0 12px; font: inherit; cursor: pointer; }
  #usage { color: #ffb000; font-size: 11px; margin-bottom: 6px; }
  #hint { color: var(--dim); margin-top: 6px; font-size: 11px; }
</style>
</head>
<body>
<canvas id="holo"></canvas>
<div id="console">
  <div id="log"></div>
  <div id="usage">Consumo: sin llamadas a OpenAI todavía</div>
  <form id="form" autocomplete="off">
    <input id="q" placeholder="Escribe al asistente… (Enter)" aria-label="Mensaje al asistente">
    <button type="submit">Enviar</button>
  </form>
  <div id="hint">Esc: salir del cuadro · H: modo holograma · F: pantalla completa · M: espejo</div>
</div>
<script src="/static/hologram.js"></script>
</body>
</html>
